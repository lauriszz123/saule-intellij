<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none" role="img" aria-label="Saule">
  <title>Saule</title>
  <!--
    The plugin logo shown on JetBrains Marketplace and in the plugin list.
    40x40 is what the Marketplace asks for; the drawing is 64 units, so the
    viewBox does the scaling and the file stays sharp at any density.

    Generated from `brand/saule-mark.svg` in the language repository — edit it
    there and copy, do not diverge. There is deliberately no pluginIcon_dark:
    the mark is transparent and its oranges hold up on both IDE themes.
  -->
  <defs>
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="0.55" stop-color="#FBAE34"/>
      <stop offset="1" stop-color="#EF7F25"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBAE34"/>
      <stop offset="1" stop-color="#EF7F25"/>
    </linearGradient>
    <linearGradient id="moonFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="1" stop-color="#FFD98A"/>
    </linearGradient>
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="64" height="40"/>
    </clipPath>
    <mask id="orbitBreak">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <circle cx="50" cy="12" r="9.2" fill="#000"/>
    </mask>
    <mask id="crescent">
      <circle cx="50" cy="12" r="7.5" fill="#fff"/>
      <circle cx="53.6" cy="8.6" r="7" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#aboveHorizon)" mask="url(#orbitBreak)">
    <ellipse cx="32" cy="29" rx="28" ry="11.5" transform="rotate(-30 32 29)"
             fill="none" stroke="#F6A32C" stroke-width="1.9" stroke-linecap="round"/>
  </g>

  <path d="M13 40a19 19 0 0 1 38 0Z" fill="url(#sun)"/>

  <g fill="url(#water)">
    <ellipse cx="32" cy="41.1" rx="29" ry="1.5"/>
    <ellipse cx="32" cy="46" rx="20" ry="1.6" opacity="0.85"/>
    <ellipse cx="32" cy="51" rx="12.5" ry="1.5" opacity="0.7"/>
    <ellipse cx="32" cy="55.6" rx="6.5" ry="1.3" opacity="0.52"/>
  </g>

  <g mask="url(#crescent)">
    <circle cx="50" cy="12" r="7.5" fill="url(#moonFace)"/>
  </g>
</svg>
